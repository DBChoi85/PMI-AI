name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.14'
      - name: Test
        id: unit-tests
        continue-on-error: true
        run: gradle test --stacktrace
      - name: Print JUnit test results
        if: always()
        shell: bash
        run: |
          echo "===== JUnit XML results ====="
          find build/test-results/test -type f -name '*.xml' -print -exec cat {} \; || true
      - name: Fail if unit tests failed
        if: steps.unit-tests.outcome == 'failure'
        run: exit 1
      - name: Compile JMH benchmarks
        run: gradle jmhClasses
