name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.14'
      - name: Test
        id: unit-tests
        continue-on-error: true
        run: gradle test --stacktrace
      - name: Print JUnit test results
        if: always()
        shell: bash
        run: |
          echo "===== Gradle test outputs ====="
          if [ -d build/test-results/test ]; then
            find build/test-results/test -type f -name '*.xml' -print -exec cat {} \;
          else
            echo "JUnit XML results were not generated; Gradle did not reach or complete test execution."
            echo "Existing build outputs:"
            find build -maxdepth 3 -type f -print 2>/dev/null || true
          fi
      - name: Fail if unit tests failed
        if: steps.unit-tests.outcome == 'failure'
        run: exit 1
      - name: Compile JMH benchmarks
        run: gradle jmhClasses
