plugins {
    id 'java'
    id 'me.champeau.jmh' version '0.7.3'
}

group = 'io.github.dbchoi85'
version = '0.1.0-SNAPSHOT'

repositories { mavenCentral() }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

dependencies {
    implementation 'org.bouncycastle:bcprov-jdk18on:1.82'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.82'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.20.0'

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()

    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
        showExceptions = true
        showCauses = true
        showStackTraces = true
        showStandardStreams = true
    }
}

jmh {
    warmupIterations = 5
    iterations = 10
    fork = 3
    timeOnIteration = '1s'
    resultFormat = 'CSV'
    resultsFile = project.file("${project.layout.buildDirectory.get()}/results/jmh/results.csv")
    profilers = []
}


tasks.register('exportBenchmarkMetadata', JavaExec) {
    group = 'benchmark'
    description = 'Write results/environment.json and optionally summarize a raw benchmark CSV.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.github.dbchoi85.pmiai.results.ResultExportMain'
    if (project.hasProperty('rawFile')) {
        args project.property('rawFile')
    }
}


tasks.register('adversarialSuite', JavaExec) {
    group = 'verification'
    description = 'Run the E6 adversarial authorization correctness suite.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.github.dbchoi85.pmiai.security.AdversarialSuiteMain'
    if (project.hasProperty('attempts')) {
        systemProperty 'pmiai.adversarialAttempts', project.property('attempts')
    }
}


tasks.register('publicationBenchmark', JavaExec) {
    group = 'benchmark'
    description = 'Run E1-E5 and write canonical publication raw/summary/environment results.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.github.dbchoi85.pmiai.results.PublicationBenchmarkMain'
    ['runs', 'iterations', 'warmups'].each { key ->
        if (project.hasProperty(key)) {
            systemProperty 'pmiai.' + key, project.property(key)
        }
    }
}


tasks.register('copyBenchmarkRuntime', Copy) {
    group = 'benchmark'
    description = 'Copy runtime dependencies for direct java benchmark execution.'
    from configurations.runtimeClasspath
    into layout.buildDirectory.dir('benchmark-libs')
}

tasks.register('preparePublicationBenchmarks') {
    group = 'benchmark'
    description = 'Compile classes and prepare dependencies; measurements are run by java, not Gradle.'
    dependsOn classes, copyBenchmarkRuntime
}
